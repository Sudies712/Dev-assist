server:
  port: 8080

spring:
  application:
    name: dev-assist
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

# Sa-Token（与接口契约 §1.3 对齐：请求头 Authorization: Bearer <token>）
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-log: false
  # JWT 模式在认证切片启用（需引入 sa-token-jwt 插件 + 注册 StpLogicJwt）
  jwt-secret-key: ${SA_JWT_SECRET:dev-assist-jwt-secret-change-in-prod}

# springdoc-openapi（Swagger UI，替代 Knife4j）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 业务自定义配置
dev-assist:
  upload:
    # 附件存储根目录（相对路径基于工作目录）；生产建议外置到独立数据卷
    dir: ${user.dir}/uploads
  rag:
    top-k: 5
    chunk-size: 300
    chunk-overlap: 50
  ai:
    timeout-seconds: 30

# DeepSeek（LLM，OpenAI 兼容；key 由环境变量注入，见 README「环境变量」节）
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}

# Qdrant 向量库（知识库 RAG 切片存储；容器已就绪）
qdrant:
  host: 127.0.0.1
  rest-port: 6333
  grpc-port: 6334
  collection: dev_assist_chunks
